<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Iris — Exhibition</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  body{transition:background-color .35s}
  body.fs,body.fs *{cursor:none!important}
  #stage{position:absolute;inset:0;margin:auto;width:min(100vw,177.78vh);height:min(56.25vw,100vh)}
  body.portrait #stage{width:min(100vw,56.25vh);height:min(177.78vw,100vh)}
  /* 장 전환: 새 장이 위에서 서서히 나타나고 이전 장은 그 아래 그대로 있다가 사라짐(둘 다 반투명해지며 바탕이 비치던 깜빡임 방지) */
  .slide{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden;z-index:0;pointer-events:none}
  .slide.on{opacity:1;visibility:visible;z-index:2;transition:opacity .35s ease}
  .slide.prev{opacity:1;visibility:visible;z-index:1}
  .slide img,.slide video{position:absolute;left:0;top:0;width:100%;height:100%;-webkit-user-drag:none;object-fit:fill}
  .canvas{position:absolute;left:0;top:0;width:100%;will-change:transform;backface-visibility:hidden}
  .slide img.nav{height:11.111%}
  .slide > video{z-index:1}
  .slide img.nav,.slide img.top{z-index:2}
  .slide img.nav.solid{height:13.333%;object-fit:contain;object-position:top}
  .slide video.feather{-webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent)}
  /* 세로 화면: 가로 장의 영역(창)을 잘라 다시 배치. 창 가장자리는 배경으로 흐림 */
  .win{position:absolute;overflow:hidden}
  .win.fade{
    -webkit-mask-image:linear-gradient(to right,transparent,#000 40px,#000 calc(100% - 40px),transparent),linear-gradient(transparent,#000 40px,#000 calc(100% - 40px),transparent);
    -webkit-mask-composite:source-in;mask-composite:intersect;
    mask-image:linear-gradient(to right,transparent,#000 40px,#000 calc(100% - 40px),transparent),linear-gradient(transparent,#000 40px,#000 calc(100% - 40px),transparent)}
  .win > div{position:absolute}
  .arrow{position:absolute;top:50%;width:3.4%;aspect-ratio:1;margin-top:-1.7%;border-radius:50%;z-index:5;
    background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none;
    box-shadow:0 0 0 1px rgba(0,0,0,.06),0 2px 12px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.08);transition:opacity .4s ease,background .4s ease,box-shadow .4s ease}
  body.portrait .arrow{width:6%;margin-top:-3%}
  .arrow::after{content:"";position:absolute;inset:0;margin:auto;width:24%;height:24%;
    border:solid rgba(17,17,17,.78);border-width:0 2px 2px 0;transition:border-color .4s ease}
  /* 어두운 장: 반투명 흰 원 + 흰 화살표 (밝은 장은 위의 흰 원 + 검은 화살표) */
  .arrow.dark{background:rgba(255,255,255,.16);box-shadow:0 0 0 1px rgba(255,255,255,.32),0 2px 14px rgba(0,0,0,.35)}
  .arrow.dark::after{border-color:#fff}
  #prev{left:3.6%} #prev::after{transform:translateX(15%) rotate(135deg)}
  #next{right:3.6%} #next::after{transform:translateX(-15%) rotate(-45deg)}
  /* 스크롤 장: 맨 아래까지 내려가기 전엔 다음 버튼을 흐리게(막힘), 내려가면 다시 켜지며 한 번 살짝 커짐 */
  #next.off{opacity:.3} .arrow.end{opacity:0}
  #next.ready{animation:ready .9s ease 2}
  @keyframes ready{50%{transform:scale(1.18)}}
  #fsbtn{position:fixed;right:12px;bottom:12px;padding:8px 12px;border:0;border-radius:8px;z-index:9;
    background:rgba(255,255,255,.15);color:#fff;font:14px system-ui,sans-serif;cursor:pointer}
  body.fs #fsbtn{display:none}
  /* Process 온톨로지 장: 하단 고정 '온톨로지 보러가기' → 시각화 앱을 전시 화면 위에 띄움(전체화면 유지), 오른쪽 위 '돌아가기' */
  .slide video.round{border-radius:.857%/1.371%}
  .cw{position:absolute;inset:0;overflow:hidden}
  /* 크레딧이 위아래 끝에서 나타나고 사라질 때 흐리게 */
  .cw.m-credit{-webkit-mask-image:linear-gradient(transparent 12%,#000 26%,#000 78%,transparent 94%);mask-image:linear-gradient(transparent 12%,#000 26%,#000 78%,transparent 94%)}
  .grow-l{position:absolute;inset:0;width:100%;height:100%;background-size:100% 100%;clip-path:var(--c0);-webkit-clip-path:var(--c0)}
  .slide.grow .grow-l{clip-path:var(--c1);-webkit-clip-path:var(--c1);transition:clip-path var(--t) cubic-bezier(.22,.61,.36,1) var(--d),-webkit-clip-path var(--t) cubic-bezier(.22,.61,.36,1) var(--d)}
  /* 새로 불러온 영상은 첫 장면이 준비되면 서서히 나타남(Design System 처음 들어갈 때 등) */
  .slide video{transition:opacity .5s ease}
  .pill{position:absolute;z-index:8;border:0;border-radius:999px;display:flex;align-items:center;gap:.5em;white-space:nowrap;
    font:500 clamp(13px,0.94vw,18px)/1 "SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;letter-spacing:-.01em;
    transition:opacity .35s ease,transform .2s ease}
  .pill:active{transform:scale(.96)}
  #ontoGo{left:50%;bottom:4.4%;transform:translateX(-50%);padding:1.1em 1.8em;background:#111;color:#fff;
    box-shadow:0 6px 24px rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.12);opacity:0;pointer-events:none}
  #ontoGo:active{transform:translateX(-50%) scale(.96)}
  body.onto-slide #ontoGo{opacity:1;pointer-events:auto}
  #onto{position:fixed;inset:0;z-index:20;background:#e9f3fb;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s .35s}
  #onto.on{opacity:1;visibility:visible;transition:opacity .35s ease}
  #onto iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  #ontoBack{top:20px;right:24px;padding:.85em 1.3em;background:rgba(255,255,255,.96);color:#111;
    box-shadow:0 0 0 1px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.12)}
</style>
</head>

</div>
