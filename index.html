<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Iris — Exhibition</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  body{transition:background-color .35s}
  body.fs,body.fs *{cursor:none!important}
  #stage{position:absolute;inset:0;margin:auto;width:min(100vw,177.78vh);height:min(56.25vw,100vh)}
  .slide{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity .35s ease;pointer-events:none}
  .slide.on{opacity:1}
  .slide img,.slide video{position:absolute;left:0;top:0;width:100%;height:100%;-webkit-user-drag:none;object-fit:fill}
  .canvas{position:absolute;left:0;top:0;width:100%;will-change:transform}
  .slide img.nav{height:11.111%}
  /* 스크롤 장 메뉴: 장 배경색을 깔고 아래 24px 은 흐리게 — 올라가는 콘텐츠가 메뉴 글자와 겹치지 않게 */
  .slide img.nav.solid{height:13.333%;object-fit:contain;object-position:top}
  .slide video.fade-t{-webkit-mask-image:linear-gradient(transparent,#000 40px);mask-image:linear-gradient(transparent,#000 40px)}
  .slide video.fade-b{-webkit-mask-image:linear-gradient(#000 calc(100% - 40px),transparent);mask-image:linear-gradient(#000 calc(100% - 40px),transparent)}
  .slide video.fade-tb{-webkit-mask-image:linear-gradient(transparent,#000 40px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(transparent,#000 40px,#000 calc(100% - 40px),transparent)}
  .slide video.feather{-webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent)}
  .arrow{position:absolute;top:50%;width:3.4%;aspect-ratio:1;margin-top:-1.7%;border-radius:50%;
    background:rgba(127,127,127,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:none}
  .arrow::after{content:"";position:absolute;inset:0;margin:auto;width:24%;height:24%;
    border:solid rgba(255,255,255,.9);border-width:0 2px 2px 0}
  #prev{left:1.2%} #prev::after{transform:translateX(15%) rotate(135deg)}
  #next{right:1.2%} #next::after{transform:translateX(-15%) rotate(-45deg)}
  #fsbtn{position:fixed;right:12px;bottom:12px;padding:8px 12px;border:0;border-radius:8px;
    background:rgba(255,255,255,.15);color:#fff;font:14px system-ui,sans-serif;cursor:pointer}
  body.fs #fsbtn{display:none}
</style>
</head>
<body>
<div id="stage">
  <div class="arrow" id="prev"></div><div class="arrow" id="next"></div>
</div>
<button id="fsbtn" title="F 키로도 전체화면">전체화면</button>
<script src="media/overlays.js"></script>
<script>
// Figma '여기' 섹션의 16:9 프레임을 내보낸 PNG. 파일명 = 프레임 이름 앞 5글자 (예: 02-03.png)
var TABS = [['Background',2],['Research',4],['Process',5],['Design System',3],['Interface',15],['Credit',1]];
// 세부 탭: 탭 번호 → [이름, 탭 안 시작 장]. Interface 메뉴 아래 작은 글씨(x 1506~1634, y 86~135) 터치 영역
var SUBS = { 4: [['Web', 0], ['Mobile', 10]] }, SUB_X = 1506, SUB_W = 64, SUB_Y0 = 86, SUB_Y1 = 135;
var W = 1920, H = 1080, NAV_H = 120, TAB_X = 760, TAB_W = 180, EDGE = 0.12;
// 스크롤 장: 피그마 '(스크롤)' 프레임. slides/키.png = 세로로 긴 Content, 키-nav.png = 고정 메뉴(투명).
// delay 뒤 end(px)만큼 위로 스크롤하고, 끝나면 after 영상 재생.
var SCROLL = {
  '02-01': { h: 1714, end: 634, delay: 4000 },
  '02-04': { h: 1953, end: 850, delay: 4000 },
  '03-03': { h: 2110, end: 1030, delay: 4000 },
  '04-02': { h: 1869, end: 789, delay: 4000 }
};
var SCROLL_MS = 1400;
// 영상이 메뉴 영역까지 덮는 장: 메뉴(slides/키-nav.png, 투명)를 영상 위에 한 번 더 올림
var NAV_ON_TOP = ['03-04'];

var stage = document.getElementById('stage'), slides = [], tabStart = [], tabOf = [];
TABS.forEach(function (t, ti) {
  tabStart.push(slides.length);
  for (var i = 1; i <= t[1]; i++) {
    var key = pad(ti + 1) + '-' + pad(i), sc = SCROLL[key];
    var el = document.createElement('div'), cv = document.createElement('div'), img = new Image();
    el.className = 'slide'; el.videos = []; el.scroll = sc; el.canvas = cv;
    cv.className = 'canvas'; cv.style.height = (sc ? sc.h / H : 1) * 100 + '%';
    img.src = 'slides/' + key + '.png'; img.alt = t[0] + ' ' + i; img.draggable = false;
    cv.appendChild(img); el.appendChild(cv);
    img.onload = function () {  // 화면 밖(비율이 16:9 가 아닐 때 남는 곳) 배경 = 슬라이드 왼쪽 위 색
      try { var c = document.createElement('canvas').getContext('2d'); c.drawImage(this, -4, -4); var d = c.getImageData(0, 0, 1, 1).data;
        var s = this.parentNode.parentNode; s.bg = 'rgb(' + d[0] + ',' + d[1] + ',' + d[2] + ')'; if (s.classList.contains('on')) document.body.style.background = s.bg;
        if (s.scroll && s.navEl) s.navEl.style.background = 'linear-gradient(' + s.bg + ' 83.3%, transparent)'; } catch (e) {}
    };
    OVERLAYS.forEach(function (ov) {  // GIF 로 만든 움직이는 부분 (media/, tools/overlays.py 로 생성)
      if (ov.slide !== key) return;
      var v = document.createElement('video');
      v.src = ov.src; v.muted = v.playsInline = true; v.loop = ov.loop !== false; v.preload = 'auto'; v.after = ov.after;
      v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
      v.style.left = ov.box[0] * 100 + '%'; v.style.top = ov.box[1] * 100 + '%';
      v.style.width = ov.box[2] * 100 + '%'; v.style.height = ov.box[3] * 100 + '%';
      if (ov.feather) v.className = 'feather'; else if (ov.fade) v.className = 'fade-' + ov.fade;
      cv.appendChild(v); el.videos.push(v);
    });
    if (sc || NAV_ON_TOP.indexOf(key) >= 0) { var nv = new Image(); nv.src = 'slides/' + key + '-nav.png'; nv.className = sc ? 'nav solid' : 'nav'; nv.draggable = false; el.appendChild(nv); el.navEl = nv; }
    stage.insertBefore(el, stage.firstChild);
    slides.push(el); tabOf.push(ti);
  }
});
function pad(n) { return (n < 10 ? '0' : '') + n; }
function play(v) { v.currentTime = 0; var p = v.play(); if (p && p.catch) p.catch(function () {}); }

var cur = 0, timers = [];
// 스크롤 장: off = 위로 올라간 거리(px, 1920x1080 기준). 자동 스크롤 + 손으로 위아래 드래그
function setOff(el, off, ms) {
  var sc = el.scroll; off = Math.max(0, Math.min(sc.h - H, off)); el.off = off;
  el.canvas.style.transition = ms ? 'transform ' + ms + 'ms cubic-bezier(.65,0,.35,1)' : 'none';
  el.canvas.style.transform = 'translateY(' + (-off / sc.h * 100) + '%)';
  if (!el.afterStarted && off >= sc.end * 0.5) {  // 아래 내용이 보이면 그 영상 재생
    el.afterStarted = true;
    setTimeout(function () { if (el.classList.contains('on')) el.videos.forEach(function (v) { if (v.after) play(v); }); }, ms || 0);
  }
}
function go(n) {
  n = (n + slides.length) % slides.length;
  timers.forEach(clearTimeout); timers = [];
  var old = slides[cur]; old.classList.remove('on');
  if (old !== slides[n]) setTimeout(function () {
    if (old.classList.contains('on')) return;
    old.videos.forEach(function (v) { v.pause(); v.currentTime = 0; });
    if (old.scroll) setOff(old, 0);
  }, 400);
  cur = n; var el = slides[cur]; el.classList.add('on'); if (el.bg) document.body.style.background = el.bg;
  el.videos.forEach(function (v) { if (!v.after) play(v); else { v.pause(); v.currentTime = 0; } });
  var sc = el.scroll;
  if (sc) {
    el.afterStarted = false; setOff(el, 0);
    timers.push(setTimeout(function () { setOff(el, sc.end, SCROLL_MS); }, sc.delay));
  }
}
go(0);

// 터치: 좌우 스와이프로 앞뒤, 스크롤 장은 위아래 드래그, 탭 영역(상단 메뉴/로고/좌우 끝)으로 이동
var sx = null, sy = 0, dragging = false, startOff = 0;
document.addEventListener('pointerdown', function (e) {
  sx = e.clientX; sy = e.clientY; dragging = false; startOff = slides[cur].off || 0; lockFs();
});
document.addEventListener('pointermove', function (e) {
  var el = slides[cur];
  if (sx === null || !el.scroll) return;
  var dx = e.clientX - sx, dy = e.clientY - sy;
  if (!dragging && Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) {
    dragging = true; timers.forEach(clearTimeout); timers = [];  // 직접 움직이면 자동 스크롤 취소
  }
  if (dragging) setOff(el, startOff - dy * H / stage.getBoundingClientRect().height);
});
document.addEventListener('wheel', function (e) {
  var el = slides[cur]; if (!el.scroll) return;
  timers.forEach(clearTimeout); timers = []; setOff(el, (el.off || 0) + e.deltaY);
}, { passive: true });
document.addEventListener('pointerup', function (e) {
  if (sx === null) return;
  var dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
  if (dragging) { dragging = false; return; }
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) return go(cur + (dx < 0 ? 1 : -1));
  var r = stage.getBoundingClientRect();
  var x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  if (x < 0 || x > 1 || y < 0 || y > 1) return;
  var sub = SUBS[tabOf[cur]], j = Math.floor((x * W - SUB_X) / SUB_W);
  if (sub && y > SUB_Y0 / H && y < SUB_Y1 / H && j >= 0 && j < sub.length) return go(tabStart[tabOf[cur]] + sub[j][1]);
  if (y < NAV_H / H) {
    if (x < 160 / W) return go(0);
    var k = Math.floor((x * W - TAB_X) / TAB_W);
    if (k >= 0 && k < TABS.length) return go(tabStart[k]);
    return;
  }
  if (x < EDGE) go(cur - 1); else if (x > 1 - EDGE) go(cur + 1);
});
['contextmenu', 'dragstart', 'selectstart', 'gesturestart'].forEach(function (ev) {
  document.addEventListener(ev, function (e) { e.preventDefault(); });
});

// 전체화면: Esc 를 누르기 전까지는 잠금. 다른 방법으로 빠져나가면 다음 터치에 다시 전체화면.
var userExited = false;
function enterFs() {
  var el = document.documentElement;
  var p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  if (p && p.then) p.then(function () {
    if (navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock(['Escape']).catch(function () {});
    if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {});
  }).catch(function () {});
}
function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function lockFs() { if (!isFs() && !userExited) enterFs(); }
function onFsChange() { document.body.classList.toggle('fs', isFs()); }
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { userExited = true; if (isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  else if (e.key === 'f' || e.key === 'F') { userExited = false; enterFs(); }
  else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') go(cur + 1);
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
});
document.addEventListener('keyup', function (e) { if (e.key === 'Escape' && !isFs()) userExited = true; });
document.getElementById('fsbtn').addEventListener('pointerup', function (e) { e.stopPropagation(); userExited = false; enterFs(); });
</script>
</body>
</html>
